name: Publish docs via GitHub Pages
on:
  push:
    branches:
    # Remember to add v before the following version number unless the version is master.
      - v3.4.4

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # fetch all commits/branches for gitversion

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name : prepare
        run: sh ./prepare.sh 

      - name: Git Config
        run: git config user.name whitewum && git config user.email min.wu@vesoft.com
          
      - name: Mike Deploy 3.4.4
        run: |
          # mike delete 3.4.4 -p
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            if mike deploy 3.4.4 --rebase -p; then
              mike list
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep $((attempt * 30))
          done

      # - name: Deploy
      #   uses: peaceiris/actions-gh-pages@v3
      #   with:
      #     github_token: ${{ secrets.DEPLOY_TOKEN }}
      #     publish_dir: ./site
